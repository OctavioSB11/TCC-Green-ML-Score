name: CI - GreenML Score

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Testes & Qualidade (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Instalar Dependências do Pacote, Dev e Experimentos
        # Os testes cobrem também experiments/ (análise, relatórios em Markdown e
        # validação), que dependem do extra "experiments" (tabulate, scipy,
        # matplotlib, xgboost). Sem ele, to_markdown() falha por falta do tabulate.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev,experiments]

      - name: Verificação de Estilo e Linting (Ruff)
        run: |
          ruff check .

      - name: Verificação de Formatação (Black)
        run: |
          black --check .

      - name: Executar Bateria de Testes com Cobertura (Pytest-cov)
        env:
          CODECARBON_OFFLINE_MODE: "true"
        run: |
          pytest --cov=green_ml_score --cov-report=term-missing
