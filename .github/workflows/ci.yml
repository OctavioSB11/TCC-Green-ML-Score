name: CI - GreenML Score

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Testes & Qualidade (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # Modo offline do CodeCarbon e matplotlib sem tela (cartão ambiental em PNG).
      CODECARBON_OFFLINE_MODE: "true"
      MPLBACKEND: "Agg"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Instalar Dependências do Pacote, Dev, Experimentos e Painel
        # Os testes cobrem também experiments/ (análise, relatórios em Markdown e
        # validação), que dependem do extra "experiments" (tabulate, scipy,
        # matplotlib, xgboost), e os gráficos do painel (app/), que dependem do
        # extra "app" (streamlit, plotly, matplotlib). O painel exige Python 3.11 ou
        # superior (Streamlit 1.66); no 3.10 só a biblioteca e os experimentos são
        # instalados e testados, e os testes do painel não são coletados.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[${{ matrix.python-version == '3.10' && 'dev,experiments' || 'dev,experiments,app' }}]"

      - name: Verificação de Estilo e Linting (Ruff)
        run: |
          ruff check .

      - name: Verificação de Formatação (Black)
        run: |
          black --check .

      - name: Executar Bateria de Testes com Cobertura (Pytest-cov)
        # Biblioteca, experimentos e camada de dados do painel. Nenhum teste usa
        # internet: os dados vêm de experiments/results e experiments/contexts.
        run: |
          pytest --ignore=tests/test_app_pages.py --cov=green_ml_score --cov=app

      - name: Smoke Test das Telas do Painel (Streamlit AppTest, sem servidor)
        if: matrix.python-version != '3.10'
        # Roda a página inicial e as cinco telas para os três conjuntos de dados e
        # confere os números de aceite (por exemplo, XGBoost em Estocolmo à frente
        # da RL na Índia com peso total no carbono).
        run: |
          pytest tests/test_app_pages.py --cov=green_ml_score --cov=app --cov-append --cov-report=term-missing
