name: CI - GreenML Score

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Testes & Qualidade (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependências do Pacote e Dev
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verificação de Estilo e Linting (Ruff)
        run: |
          ruff check .

      - name: Verificação de Formatação (Black)
        run: |
          black --check .

      - name: Executar Bateria de Testes (Pytest)
        run: |
          pytest
