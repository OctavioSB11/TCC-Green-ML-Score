[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-ml-score"
version = "0.1.0"
description = "Métrica ambiental para modelos de Machine Learning."
readme = "README.md"
authors = [
  { name = "Octavio Bordotti e Danilo Parolin" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mlflow>=2.0.0",
    "codecarbon>=2.3.1",
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black",
    "ruff"
]
experiments = [
    "xgboost>=1.7.0",
    "datasets>=2.10.0",
    "torch>=2.0.0",
    "transformers>=4.25.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["green_ml_score", "green_ml_score.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
